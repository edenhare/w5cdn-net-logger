[project]
name = "net-logger"
version = "0.1.0"
description = "W5CDN Net Logger — Local Ham Radio Net Control, Skywarn, RACES & NTS Logger"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]
ui = [
    "axe-playwright-python>=0.1.5",
    "playwright>=1.50.0",
]
packaging = [
    "pyinstaller>=6.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov=desktop --cov-report=term-missing --cov-fail-under=90"
markers = [
    "ui: Playwright real-browser UI E2E and WCAG accessibility tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
