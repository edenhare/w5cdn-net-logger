default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.(ico|png|svg)$
      - id: trailing-whitespace
        exclude: \.(md|ico|png|svg)$
      - id: mixed-line-ending
        args: ["--fix=lf"]
        files: ^(start\.sh|scripts/install_linux_desktop\.sh|\.github/.*\.ya?ml|\.pre-commit-config\.yaml)$

  - repo: local
    hooks:
      - id: block-runtime-secrets-and-db
        name: Block local DB, config.txt/.env, backups & radiograms
        language: python
        entry: >-
          python -c "import pathlib, re, sys;
          bad = [f for f in sys.argv[1:] if re.search(r'(^|/)(\.env|config\.txt|desktop_startup\.log|update\.log)$|\.(db|db-wal|db-shm|bak)$|(^|/)(radiograms|outbox)/', pathlib.Path(f).as_posix(), re.I)];
          sys.exit('Blocked sensitive/runtime files: ' + ', '.join(bad)) if bad else None"
        pass_filenames: true

      - id: electron-typecheck-and-test
        name: W5CDN Net Logger TypeScript typecheck, UI integrity & Vitest suite
        language: python
        entry: >-
          python -c "import os, shutil, subprocess, sys;
          env = os.environ.copy();
          env['PATH'] = (r'C:\Program Files\nodejs;' if os.name == 'nt' else '') + env.get('PATH', '');
          npm = shutil.which('npm.cmd', path=env['PATH']) or shutil.which('npm', path=env['PATH']);
          sys.exit(0) if not npm or not os.path.isdir('node_modules') else None;
          r1 = subprocess.run([npm, 'run', 'typecheck'], env=env);
          sys.exit(r1.returncode) if r1.returncode else None;
          r2 = subprocess.run([npm, 'test'], env=env);
          sys.exit(r2.returncode)"
        pass_filenames: false
        files: ^(src/(electron|static)/.*|tests/electron/.*|scripts/.*\.mjs|package\.json|tsconfig\.json|vitest\.config\.ts)$

      - id: nts-traffic-typecheck-and-test
        name: NTS Traffic Manager TypeScript typecheck & Vitest suite
        language: python
        entry: >-
          python -c "import os, shutil, subprocess, sys;
          env = os.environ.copy();
          env['PATH'] = (r'C:\Program Files\nodejs;' if os.name == 'nt' else '') + env.get('PATH', '');
          npm = shutil.which('npm.cmd', path=env['PATH']) or shutil.which('npm', path=env['PATH']);
          sys.exit(0) if not npm or not os.path.isdir('apps/nts-traffic/node_modules') else None;
          r1 = subprocess.run([npm, 'run', 'typecheck'], cwd='apps/nts-traffic', env=env);
          sys.exit(r1.returncode) if r1.returncode else None;
          r2 = subprocess.run([npm, 'test'], cwd='apps/nts-traffic', env=env);
          sys.exit(r2.returncode)"
        pass_filenames: false
        files: ^apps/nts-traffic/.*$

      - id: conventional-commit
        name: Validate Conventional Commit message
        language: python
        stages: [commit-msg]
        entry: >-
          python -c "import pathlib, re, sys;
          msg = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()[0].strip();
          ok = bool(re.match(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+', msg)) or msg.startswith(('Merge ', 'Revert '));
          sys.exit('Commit message must follow Conventional Commits (e.g. feat(ui): ... or fix: ...). Got: ' + msg) if not ok else None"

      - id: vitest-pre-push
        name: Full TypeScript check, version check & Vitest coverage gate (pre-push)
        language: python
        stages: [pre-push]
        entry: >-
          python -c "import os, shutil, subprocess, sys;
          env = os.environ.copy();
          env['PATH'] = (r'C:\Program Files\nodejs;' if os.name == 'nt' else '') + env.get('PATH', '');
          node = shutil.which('node.exe', path=env['PATH']) or shutil.which('node', path=env['PATH']);
          npm = shutil.which('npm.cmd', path=env['PATH']) or shutil.which('npm', path=env['PATH']);
          sys.exit('Node.js/npm not found on PATH') if not (node and npm) else None;
          r1 = subprocess.run([node, 'scripts/bump-version.mjs', '--check'], env=env);
          sys.exit(r1.returncode) if r1.returncode else None;
          r2 = subprocess.run([npm, 'run', 'typecheck'], env=env);
          sys.exit(r2.returncode) if r2.returncode else None;
          r3 = subprocess.run([npm, 'run', 'test:cov'], env=env);
          sys.exit(r3.returncode)"
        pass_filenames: false
        always_run: true
